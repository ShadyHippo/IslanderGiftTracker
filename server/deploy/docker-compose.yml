services:
  acnh:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    container_name: acnh
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      STATIC_DIR: /app/client/dist
      SECURE_COOKIES: "true"
      # First-boot accounts are OPT-IN: uncomment and set your own, or run
      #   docker compose run --rm acnh -set-password <user> -password <pass>
      # ACNH_INIT_USERS: "alice:CHANGE_ME,bob:CHANGE_ME"
    volumes:
      - acnh-data:/data

volumes:
  acnh-data:
