services:
  acnh:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    container_name: acnh
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      STATIC_DIR: /app/client/dist
      SECURE_COOKIES: "true"
      # Comma-separated user:password, applied ONLY on first start (empty users table).
      # Or use: docker compose run --rm acnh -set-password <user> -password <pass>
      ACNH_INIT_USERS: "wife:CHANGE_ME,hippo:CHANGE_ME"
    volumes:
      - acnh-data:/data

volumes:
  acnh-data:
