services:
  acnh:
    build:
      context: .
      dockerfile: server/deploy/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-dev}
    container_name: acnh
    restart: unless-stopped
    ports:
      # Loopback only by default. Publish to 0.0.0.0 only if you really intend
      # to expose the origin: behind SWAG/Cloudflare the proxy reaches the
      # container over the Docker network (http://acnh:8080), not this port.
      - "127.0.0.1:2109:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PORT: "8080"
      DATA_DIR: /data
      REF_DIR: /app/ref
      STATIC_DIR: /app/client/dist
      SECURE_COOKIES: "true"
      # --- Login mode -----------------------------------------------------
      # Default (below): username/password accounts, self-hosted friendly.
      # For a public Google-only instance see README "Public instance":
      # AUTH_MODE: "google"
      # GOOGLE_CLIENT_ID: "xxxx.apps.googleusercontent.com"
      # GOOGLE_CLIENT_SECRET: "GOCSPX-..."
      # First-boot accounts are OPT-IN. Never ship a known password: uncomment
      # and choose your own, or run:
      #   docker compose run --rm acnh -set-password <user> -password <pass>
      # ACNH_INIT_USERS: "alice:CHANGE_ME"
    volumes:
      - ./data:/data
