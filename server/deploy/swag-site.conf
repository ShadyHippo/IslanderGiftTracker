# SWAG (linuxserver/swag) site config for the ACNH tracker.
# Place at: /config/nginx/site-confs/nookipedia.subdomain.conf
# Requires a matching DNS record for nookipedia.datahippo.top (Cloudflare) and
# cert in /config/nginx/ssl/ (SWAG's built-in certbot/Cloudflare flow handles it).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nookipedia.*;

    include /config/nginx/ssl.conf;
    client_max_body_size 128m;

    location / {
        include /config/nginx/proxy.conf;
        proxy_pass http://acnh:8080;
    }
}
