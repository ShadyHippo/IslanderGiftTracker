services:
  acnh:
    build:
      context: .
      dockerfile: server/deploy/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-dev}
    container_name: acnh
    restart: unless-stopped
    ports:
      - "2109:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PORT: "8080"
      DATA_DIR: /data
      REF_DIR: /app/ref
      STATIC_DIR: /app/client/dist
      SECURE_COOKIES: "true"
      # Comma-separated user:password, applied ONLY on first start (empty users table).
      # Or use: docker compose run --rm acnh -set-password <user> -password <pass>
      ACNH_INIT_USERS: "testuser:CHANGE_ME"
    volumes:
      - ./data:/data
